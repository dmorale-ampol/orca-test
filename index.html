<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todos</title>
  </head>
  <body>
    <main>
      <div role="tablist" aria-label="Sections" id="tabs">
        <button type="button" role="tab" id="tab-todos" aria-selected="true" aria-controls="panel-todos">Todos</button>
        <button type="button" role="tab" id="tab-1" aria-selected="false" aria-controls="panel-1" tabindex="-1">Tab 1</button>
        <button type="button" role="tab" id="tab-2" aria-selected="false" aria-controls="panel-2" tabindex="-1">Tab 2</button>
        <button type="button" role="tab" id="tab-3" aria-selected="false" aria-controls="panel-3" tabindex="-1">Tab 3</button>
      </div>
      <section role="tabpanel" id="panel-todos" aria-labelledby="tab-todos">
      <h1>Todos</h1>
      <form id="add-form" novalidate>
        <label for="new-title">New todo</label>
        <div class="row">
          <input id="new-title" name="title" type="text" maxlength="200" autocomplete="off" aria-describedby="form-error" />
          <button type="submit">Add</button>
        </div>
        <label for="new-due" class="due-label">Due date (optional)</label>
        <input id="new-due" name="dueDate" type="date" aria-describedby="form-error" />
        <p id="form-error" class="error" hidden></p>
      </form>
      <p id="status" role="status" aria-live="polite" class="error" hidden></p>
      <p id="empty" hidden>No todos yet. Add one above.</p>
      <ul id="list" aria-label="Todo list"></ul>
      </section>
      <section role="tabpanel" id="panel-1" aria-labelledby="tab-1" hidden>
        <button type="button" id="btn-a">A</button>
      </section>
      <section role="tabpanel" id="panel-2" aria-labelledby="tab-2" hidden>
        <button type="button" id="btn-b">B</button>
      </section>
      <section role="tabpanel" id="panel-3" aria-labelledby="tab-3" hidden>
        <button type="button" id="btn-c">C</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
